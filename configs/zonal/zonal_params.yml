# Drive every Part 2 zonal-pass parameter derivation from a single config.
# Replaces the 6 per-script configs (elev_param.yml, slope_param.yml,
# aspect_param.yml, soils_param.yml, soilmoistmax_param.yml, ssflux_param.yml)
# + the 4 lulc_*_param.yml entries that map to Part 2 invocations. Driver:
# scripts/derive_zonal_params.py (three modes: zonal, merge, build_weights).
#
# Slurm orchestration: slurm_batch/submit_zonal_params.sh loops over every
# param entry below and submits an array zonal job + chained merge (afterok).
# When an entry has `depends_on: build_weights`, the submit script first
# submits build_zonal_weights.batch and chains both the array zonal and the
# merge on its afterok.
#
# Output layout under {output_dir}:
#   <name>/                  -- per-batch zonal CSVs for the named param
#   merged/                  -- final merged per-param CSVs (one row per HRU)
#
# Note on LULC naming: the existing per-source configs at
# configs/shared_rasters/lulc/{nhm_v11,nalcms,nlcd,foresce}.yml use
# source_type="lulc" with lulc_source={nhm_v11,nalcms,nlcd,foresce} so all
# four sources write per-batch CSVs to the SAME {output_dir}/lulc/ subdir,
# colliding. Step 4 normalises: the orchestrator passes name=lulc_<source>
# to the library function, giving each source its own per-batch subdir
# (lulc_nhm_v11/, lulc_nalcms/, ...). Merged outputs land at the same
# canonical names that the legacy CLI produces, so PRMS consumers see no
# difference.
#
# Those configs/shared_rasters/lulc/*.yml files stay in place because they
# are also referenced as `sources:` by configs/shared_rasters/shared_rasters.yml
# for the Part 1 build_lulc_rasters step.

defaults:
  batch_dir: "{data_root}/{fabric}/batches"
  target_layer: nhru
  # id_feature comes from the active fabric profile in base_config.yml
  # (e.g. gfv2 -> nat_hru_id, oregon -> hru_id), injected at load time.
  output_dir: "{data_root}/{fabric}/params"
  merged_subdir: merged
  weight_dir: "{data_root}/shared/conus/weights"

params:
  # --- Continuous zonal stats on shared CONUS VRTs ---

  - name: elevation
    script: zonal
    source_raster: "{data_root}/shared/conus/vrt/elevation.vrt"
    categorical: false
    merged_file: nhm_elevation_params.csv
    # Value columns observed via `head -1 {data_root}/oregon/params/merged/
    # nhm_elevation_params.csv` (also matches gfv2). None of these are
    # provenance -- viz.py's ParamEntry only plots `mean`, but count/std/min/
    # 25%/50%/75%/max/sum are plain exactextract zonal statistics with no
    # "not derivable by design" meaning, unlike snarea_curve's cv_* columns
    # below -- so all are safe, and desirable, to fill for a missing HRU.
    fill_columns: [count, mean, std, min, "25%", "50%", "75%", max, sum]
    # `prms.provenance` here is NOT a restatement of the note above. These eight
    # ARE in fill_columns and ARE safe to fill; provenance answers a DIFFERENT
    # question -- "is this a PRMS parameter?" -- and they are not. All four
    # quadrants of (filled / not filled) x (PRMS param / not) exist in this repo.
    prms:
      builder: zonal_runners/zonal.py
      columns:
        # processes: [] -- hru_elev appears in NO pywatershed Process.get_parameters()
        # list. PRMS consumes it in the temperature/precipitation distribution
        # modules, which pywatershed handles by reading CBH files instead, and in
        # the cov_type reset rule at TM6B9:707 (HRUs above 11,500 ft). An empty
        # list is the honest answer; naming a process pywatershed does not have
        # would put a phantom heading in the generated index.
        mean:
          prms: hru_elev
          processes: []
      provenance:
        count: exactextract cell count
        std: within-HRU standard deviation
        min: within-HRU minimum
        "25%": within-HRU 25th percentile
        "50%": within-HRU median
        "75%": within-HRU 75th percentile
        max: within-HRU maximum
        sum: within-HRU sum

  - name: slope
    script: zonal
    source_raster: "{data_root}/shared/conus/vrt/slope.vrt"
    categorical: false
    merged_file: nhm_slope_params.csv
    # Same value-column set as elevation (observed on-disk; same zonal script),
    # plus the derived hru_slope below. hru_slope IS declared fillable: without
    # it, an HRU absent from the merged CSV would get `mean` KNN-filled but land
    # NaN in the PRMS parameter itself. It is a monotone transform of `mean`, so
    # interpolating it directly is exactly as defensible as interpolating `mean`.
    #
    # NB: this makes a re-merge a PREREQUISITE of the next fill sweep on any
    # fabric -- resolve_fill_plan raises on a declared column the file does not
    # have, so a slope CSV merged before this change must be re-merged with
    # `derive_zonal_params.py --mode merge --param slope` first. That failure is
    # loud and one command to fix; the alternative (silent NaN hru_slope for
    # exactly the HRUs that were missing) is not.
    fill_columns:
      [count, mean, std, min, "25%", "50%", "75%", max, sum, hru_slope]
    # PRMS hru_slope is a decimal fraction rise/run (TM6B9:536); slope.vrt is
    # rd.TerrainAttribute(dem, "slope_degrees") (compute_slope_aspect.py:72), so
    # `mean` is DEGREES -- a ~57x discrepancy for small angles. Emit the PRMS
    # quantity directly rather than leaving a footgun. ssflux.py:63 already applies
    # this same conversion to derive ssr2gw_rate/slowcoef_lin, so this makes the
    # rest of the pipeline consistent with what ssflux already assumed rather than
    # introducing a new convention. Applied in run_merge, so no zonal re-run.
    #
    # KNOWN APPROXIMATION: tan(mean) != mean(tan), and tan is convex, so this
    # underestimates. Measured over all 361,471 gfv2 HRUs (2nd-order Taylor from
    # on-disk mean/std): median 0.2%, p90 2.4%, p99 5.6%. Too small to justify a
    # CONUS fractional-slope VRT -- none exists.
    derived_columns:
      hru_slope:
        from: mean
        transform: deg_to_fraction
    prms:
      builder: zonal_runners/zonal.py + zonal_runners/merge.py (derived_columns)
      columns:
        hru_slope:
          prms: hru_slope
          processes: [PRMSSolarGeometry, PRMSAtmosphere]
      provenance:
        mean: mean cell slope in DEGREES -- the raw stat hru_slope is derived from
        count: exactextract cell count
        std: within-HRU standard deviation
        min: within-HRU minimum
        "25%": within-HRU 25th percentile
        "50%": within-HRU median
        "75%": within-HRU 75th percentile
        max: within-HRU maximum
        sum: within-HRU sum

  - name: aspect
    script: zonal
    source_raster: "{data_root}/shared/conus/vrt/aspect.vrt"
    categorical: false
    merged_file: nhm_aspect_params.csv
    # Same value-column set as elevation (observed on-disk; same zonal script).
    fill_columns: [count, mean, std, min, "25%", "50%", "75%", max, sum]
    prms:
      builder: zonal_runners/zonal.py
      columns: {}
      # DEFECTIVE, not merely renamed. `mean` is an ARITHMETIC mean of a CIRCULAR
      # variable; TM6B9:603 requires atan2(mean(sin), mean(cos)). Measured across
      # all 361,471 gfv2 HRUs the median is 179.4 deg (due south), IQR 151.7-207.5
      # -- that central tendency is the artifact, not the terrain. Unlike slope
      # above there is no recovery: a circular mean cannot be reconstructed from
      # an arithmetic one. Fixing it needs sin/cos rasters and a second zonal
      # pass. Tracked as issue #201.
      defects:
        mean:
          prms: hru_aspect
          processes: [PRMSSolarGeometry, PRMSAtmosphere]
          reason: arithmetic mean of a circular variable; TM6B9:603 requires atan2(mean(sin), mean(cos))
          recovery: none -- not reconstructable from what is on disk
          issue: 201
      provenance:
        count: exactextract cell count
        std: within-HRU standard deviation
        min: within-HRU minimum
        "25%": within-HRU 25th percentile
        "50%": within-HRU median
        "75%": within-HRU 75th percentile
        max: within-HRU maximum
        sum: within-HRU sum

  # --- Soils (categorical + continuous via the same script dispatcher) ---

  - name: soils
    script: soils
    source_raster: "{data_root}/input/soils_litho/TEXT_PRMS.tif"
    categorical: true
    merged_file: nhm_soils_params.csv
    fill_columns: [soils]
    # IDENTITY mapping under a different name: TEXT_PRMS.tif is already in PRMS
    # soil_type encoding (1=sand, 2=loam, 3=clay), verified against the raster's
    # own cell counts. The ScienceBase metadata's edom block transposes sand and
    # clay and is WRONG -- see docs/parameter_index.md's Known gaps.
    prms:
      builder: zonal_runners/soils.py
      columns:
        soils:
          prms: soil_type
          processes: [PRMSSoilzone]
      provenance: {}

  - name: soil_moist_max
    script: soils
    source_raster: "{data_root}/shared/conus/derived/soil_moist_max.tif"
    categorical: false
    merged_file: nhm_soil_moist_max_params.csv
    fill_columns: [soil_moist_max]
    prms:
      builder: zonal_runners/soils.py
      columns:
        soil_moist_max:
          prms: soil_moist_max
          processes: [PRMSRunoff, PRMSSoilzone]
      provenance: {}

  # --- LULC sources (each derives cov_type / covden / interception + rad_trncf
  #     or retention) ---
  # NHM v1.1: faithful pre-derived-raster path (script: lulc_prederived) — each
  # param is a direct zonal stat of a ScienceBase P971JAGF raster, reproducing
  # the legacy 3_coverDen.py exactly (no crosswalk collapse; covden_win from
  # loss not keep). Outputs rad_trncf, not retention. The crosswalk supplies
  # only the lu_code -> nhm_cov_type mapping for the cov_type decision tree.

  - name: lulc_nhm_v11
    script: lulc_prederived
    source_raster: "{data_root}/input/lulc_veg/nhm_v11/LULC.tif" # cov_type (5-class)
    canopy_raster: "{data_root}/input/lulc_veg/nhm_v11/CNPY.tif" # covden_sum (MODIS VCF)
    loss_raster: "{data_root}/input/lulc_veg/nhm_v11/loss.tif" # covden_win = covden_sum*(1-loss/100)
    snow_raster: "{data_root}/input/lulc_veg/nhm_v11/Snow.tif" # snow_intcp  (/100 -> inch)
    srain_raster: "{data_root}/input/lulc_veg/nhm_v11/SRain.tif" # srain_intcp (/100 -> inch)
    wrain_raster: "{data_root}/input/lulc_veg/nhm_v11/WRain.tif" # wrain_intcp (/100 -> inch)
    # radtrn raster (cnpy*keep/100 over trees) built by the shared-rasters
    # build_lulc_rasters step -> zonal-meaned + Beer's-law -> rad_trncf.
    radtrn_raster: "{data_root}/shared/conus/derived/radtrn_nhm_v11.tif"
    crosswalk_file: crosswalks/nhm_v11_nhm.csv # cov_type mapping only
    categorical: true
    merged_file: nhm_lulc_nhm_v11_params.csv
    # Observed on-disk header: gfv2/oregon still carry `retention` (built before
    # the zonal_runners/lulc_prederived.py rename); tjc (built after the rename)
    # carries `rad_trncf` instead. This is a RENAME of the same computed
    # quantity, not two different quantities -- lulc_prederived.py's own
    # docstring says "There is no `retention` column: it was only ever a
    # stand-in for rad_trncf, which this path computes directly." The alias
    # group below (a list, not a plain string) resolves to whichever of the two
    # is actually present in a given fabric's file; if NEITHER is present the
    # guard still raises exactly as it would for a plain missing column, so a
    # genuinely absent column cannot silently skip filling.
    fill_columns:
      [
        cov_type,
        srain_intcp,
        wrain_intcp,
        snow_intcp,
        covden_sum,
        covden_win,
        [retention, rad_trncf],
      ]
    # BOTH alias alternatives are declared, mapping to the same PRMS name, so a
    # fabric of either vintage is covered. Guard 1 flattens the alias group and
    # requires every alternative, so declaring only one would fail.
    prms:
      builder: zonal_runners/lulc_prederived.py
      columns:
        cov_type:
          prms: cov_type
          processes: [PRMSCanopy, PRMSSnow, PRMSSoilzone]
        covden_sum:
          prms: covden_sum
          processes: [PRMSCanopy, PRMSSnow]
        covden_win:
          prms: covden_win
          processes: [PRMSCanopy, PRMSSnow]
        srain_intcp:
          prms: srain_intcp
          processes: [PRMSCanopy]
        wrain_intcp:
          prms: wrain_intcp
          processes: [PRMSCanopy]
        snow_intcp:
          prms: snow_intcp
          processes: [PRMSCanopy]
        retention:
          prms: rad_trncf
          processes: [PRMSSnow]
        rad_trncf:
          prms: rad_trncf
          processes: [PRMSSnow]
      provenance: {}

  # NALCMS 2020: no keep raster -> crosswalk evergreen_retention column.

  - name: lulc_nalcms
    script: lulc
    source_raster: "{data_root}/input/lulc/nalcms_2020/NA_NALCMS_landcover_2020v2_30m.tif"
    canopy_raster: "{data_root}/input/lulc_veg/CNPY.tif"
    crosswalk_file: crosswalks/nalcms_nhm.csv
    categorical: true
    merged_file: nhm_lulc_nalcms_params.csv
    # Observed on-disk header (oregon + gfv2); same 7 columns as lulc_nhm_v11.
    fill_columns:
      [
        cov_type,
        srain_intcp,
        wrain_intcp,
        snow_intcp,
        covden_sum,
        covden_win,
        retention,
      ]

    # `retention` here is NOT `rad_trncf`. lulc.py:186-193 computes
    # zonal_mean(keep)/100 or the crosswalk's evergreen_retention column -- no
    # Beer's-law step. The module DOES carry a rad_trncf path (lulc.py:195-243),
    # but it is gated on `radtrn_raster`, which no `script: lulc` entry
    # configures, so it never runs for these three. Mapping it to rad_trncf would
    # assert two different derivations are the same PRMS parameter; it stays in
    # provenance until someone verifies what, if anything, it corresponds to.
    prms:
      builder: zonal_runners/lulc.py
      columns:
        cov_type:
          prms: cov_type
          processes: [PRMSCanopy, PRMSSnow, PRMSSoilzone]
        covden_sum:
          prms: covden_sum
          processes: [PRMSCanopy, PRMSSnow]
        covden_win:
          prms: covden_win
          processes: [PRMSCanopy, PRMSSnow]
        srain_intcp:
          prms: srain_intcp
          processes: [PRMSCanopy]
        wrain_intcp:
          prms: wrain_intcp
          processes: [PRMSCanopy]
        snow_intcp:
          prms: snow_intcp
          processes: [PRMSCanopy]
      provenance:
        retention: UNVERIFIED -- lulc.py's derivation differs from
          lulc_prederived.py's Beer's-law rad_trncf; do not assume they are the
          same parameter

  # NLCD 2021: no keep raster -> crosswalk evergreen_retention column.

  - name: lulc_nlcd
    script: lulc
    source_raster: "{data_root}/input/lulc_veg/nlcd/nlcd_2021_land_cover.tif"
    canopy_raster: "{data_root}/input/lulc_veg/nlcd/nlcd_2021_tree_canopy.tif"
    crosswalk_file: crosswalks/nlcd_nhm.csv
    categorical: true
    merged_file: nhm_lulc_nlcd_params.csv
    # DERIVED, not observed: no merged file exists for any fabric yet (inputs
    # unstaged). Columns per zonal_runners/lulc.py's run_lulc_batch: cov_type +
    # 3 interception + 2 covden + retention (no radtrn_raster is configured for
    # this entry, so rad_trncf is never produced) -- same 7 as lulc_nalcms,
    # which uses the identical `script: lulc` builder.
    fill_columns:
      [
        cov_type,
        srain_intcp,
        wrain_intcp,
        snow_intcp,
        covden_sum,
        covden_win,
        retention,
      ]

    # `retention` here is NOT `rad_trncf`. lulc.py:186-193 computes
    # zonal_mean(keep)/100 or the crosswalk's evergreen_retention column -- no
    # Beer's-law step. The module DOES carry a rad_trncf path (lulc.py:195-243),
    # but it is gated on `radtrn_raster`, which no `script: lulc` entry
    # configures, so it never runs for these three. Mapping it to rad_trncf would
    # assert two different derivations are the same PRMS parameter; it stays in
    # provenance until someone verifies what, if anything, it corresponds to.
    prms:
      builder: zonal_runners/lulc.py
      columns:
        cov_type:
          prms: cov_type
          processes: [PRMSCanopy, PRMSSnow, PRMSSoilzone]
        covden_sum:
          prms: covden_sum
          processes: [PRMSCanopy, PRMSSnow]
        covden_win:
          prms: covden_win
          processes: [PRMSCanopy, PRMSSnow]
        srain_intcp:
          prms: srain_intcp
          processes: [PRMSCanopy]
        wrain_intcp:
          prms: wrain_intcp
          processes: [PRMSCanopy]
        snow_intcp:
          prms: snow_intcp
          processes: [PRMSCanopy]
      provenance:
        retention: UNVERIFIED -- lulc.py's derivation differs from
          lulc_prederived.py's Beer's-law rad_trncf; do not assume they are the
          same parameter

  # FORE-SCE bau_rcp45 2070: keep raster present -> raster-based retention.

  - name: lulc_foresce
    script: lulc
    source_raster: "{data_root}/input/lulc_veg/foresce/LULC_bau_rcp45_2070.tif"
    canopy_raster: "{data_root}/input/lulc_veg/foresce/CNPY.tif"
    keep_raster: "{data_root}/input/lulc_veg/foresce/keep.tif"
    crosswalk_file: crosswalks/foresce_nhm.csv
    categorical: true
    merged_file: nhm_lulc_foresce_params.csv
    # DERIVED, not observed: no merged file exists for any fabric yet (inputs
    # unstaged). Same builder/reasoning as lulc_nlcd above -- keep_raster is
    # present, so `retention` comes from the raster-based path rather than the
    # crosswalk, but the column NAME is the same 7 as lulc_nalcms/lulc_nlcd.
    fill_columns:
      [
        cov_type,
        srain_intcp,
        wrain_intcp,
        snow_intcp,
        covden_sum,
        covden_win,
        retention,
      ]

    # `retention` here is NOT `rad_trncf`. lulc.py:186-193 computes
    # zonal_mean(keep)/100 or the crosswalk's evergreen_retention column -- no
    # Beer's-law step. The module DOES carry a rad_trncf path (lulc.py:195-243),
    # but it is gated on `radtrn_raster`, which no `script: lulc` entry
    # configures, so it never runs for these three. Mapping it to rad_trncf would
    # assert two different derivations are the same PRMS parameter; it stays in
    # provenance until someone verifies what, if anything, it corresponds to.
    prms:
      builder: zonal_runners/lulc.py
      columns:
        cov_type:
          prms: cov_type
          processes: [PRMSCanopy, PRMSSnow, PRMSSoilzone]
        covden_sum:
          prms: covden_sum
          processes: [PRMSCanopy, PRMSSnow]
        covden_win:
          prms: covden_win
          processes: [PRMSCanopy, PRMSSnow]
        srain_intcp:
          prms: srain_intcp
          processes: [PRMSCanopy]
        wrain_intcp:
          prms: wrain_intcp
          processes: [PRMSCanopy]
        snow_intcp:
          prms: snow_intcp
          processes: [PRMSCanopy]
      provenance:
        retention: UNVERIFIED -- lulc.py's derivation differs from
          lulc_prederived.py's Beer's-law rad_trncf; do not assume they are the
          same parameter

  # --- ssflux (litho-weighted PRMS subsurface flux params) ---
  # Requires the CONUS-wide P2P weight matrix (build_weights mode) and a
  # merged slope CSV. The submit script special-cases `depends_on:` to
  # submit build_zonal_weights.batch first + chain the ssflux array + merge
  # on its afterok.

  - name: ssflux
    script: ssflux
    depends_on: build_weights
    source_shapefile: "{data_root}/input/soils_litho/Lithology_exp_Konly_Project.shp"
    merged_slope_file: "{data_root}/{fabric}/params/merged/nhm_slope_params.csv"
    merged_file: nhm_ssflux_params.csv
    # Observed on-disk header (oregon + gfv2) is k_perm_wtd, mean_slope_fraction,
    # hru_area, soil2gw_max, ssr2gw_rate, fastcoef_lin, slowcoef_lin, gwflow_coef,
    # dprst_seep_rate_open, dprst_flow_coef. The first three are litho/slope
    # INPUTS to the flux normalisation below, not PRMS parameters themselves --
    # only the 7 derived flux params are declared fillable.
    fill_columns:
      - soil2gw_max
      - ssr2gw_rate
      - fastcoef_lin
      - slowcoef_lin
      - gwflow_coef
      - dprst_seep_rate_open
      - dprst_flow_coef
    # hru_area is geometry.area from the fabric -- an exact fact already on disk,
    # not something to interpolate. 77 gfv2 HRUs are absent from this file; without
    # this declaration their hru_area lands NaN (it is an INPUT column above, so
    # nobody declares it fillable), and under the retired "fill everything but the
    # ids" regime it was KNN-copied from a neighbour at up to 11,109x the truth.
    #
    # `scale: 1.0` because geometry.area is in the fabric CRS's units, and every
    # current fabric is a metre-based Albers (gfv2/oregon EPSG:5070, tjc
    # ESRI:102039) -- so m², matching what zonal_runners/ssflux.py computes for
    # every other row. A geographic-CRS fabric would yield degrees² with no error.
    #
    # NOT the PRMS `hru_area` parameter, which is acres (NHM_description TM6B9).
    # This column is the raw divisor in the flux normalisation below -- do not
    # reach for `scale` to "convert" it, or slowcoef_lin/fastcoef_lin/gwflow_coef
    # all shift. `geometry` is preferred over the fabric's own `areasqkm` column
    # so the synthesized value comes from the same computation as every other row.
    fabric_columns:
      hru_area:
        source: geometry
        scale: 1.0
    # `processes:` is PER-COLUMN, and ssflux is why. This one entry spans
    # PRMSSoilzone, PRMSGroundwater and PRMSRunoff across different columns, so an
    # entry-level `processes: [PRMSRunoff]` would report 5 non-runoff parameters as
    # feeding runoff. `hru_area` reaches here via fabric_columns, not fill_columns,
    # and is still an emitted column that needs a PRMS decision -- Guard 1 unions
    # both sources.
    prms:
      builder: zonal_runners/ssflux.py
      columns:
        soil2gw_max:
          prms: soil2gw_max
          processes: [PRMSSoilzone]
        ssr2gw_rate:
          prms: ssr2gw_rate
          processes: [PRMSSoilzone]
        fastcoef_lin:
          prms: fastcoef_lin
          processes: [PRMSSoilzone]
        slowcoef_lin:
          prms: slowcoef_lin
          processes: [PRMSSoilzone]
        gwflow_coef:
          prms: gwflow_coef
          processes: [PRMSGroundwater]
        dprst_seep_rate_open:
          prms: dprst_seep_rate_open
          processes: [PRMSRunoff]
        dprst_flow_coef:
          prms: dprst_flow_coef
          processes: [PRMSRunoff]
      provenance:
        k_perm_wtd: litho-weighted permeability, flux-normalisation input
        mean_slope_fraction: tan(radians(slope mean)), flux-normalisation input
        hru_area: fabric geometry.area in m2 -- NOT PRMS hru_area, which is acres
    # Lithology permeability + PRMS flux normalisation (lifted verbatim
    # from configs/zonal/ssflux_param.yml).
    k_perm_min: -16.48
    flux_params:
